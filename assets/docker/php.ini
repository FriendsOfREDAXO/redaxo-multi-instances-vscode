; REDAXO Multi-Instances – development defaults
memory_limit = 1024M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 512M
upload_max_filesize = 512M
max_file_uploads = 50
default_charset = "UTF-8"
date.timezone = Europe/Berlin

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

session.gc_maxlifetime = 3600

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; check files on every request – this is a development environment
opcache.revalidate_freq = 0

; allow FFI everywhere so php-vips (jcupitt/vips) can use libvips
ffi.enable = true

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; mail() is delivered via msmtp to the shared Mailpit container
sendmail_path = "/usr/bin/msmtp -t"
