name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run test:unit
      - name: Package
        run: npx vsce package
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="## Version ${VERSION}" '$0 ~ "^"v {f=1; next} /^## Version / && f {exit} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "REDAXO Multi-Instances Manager ${VERSION}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: '*.vsix'
