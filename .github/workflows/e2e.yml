name: E2E (Docker)

on:
  workflow_dispatch:
  schedule:
    # weekly – catches broken upstream images (php, mariadb, REDAXO releases)
    - cron: '0 4 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
